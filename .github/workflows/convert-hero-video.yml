name: Build browser-compatible hero video

on:
  push:
    paths-ignore:
      - "crossroads-kitchen-hero-h264.mp4"
      - ".github/workflows/convert-hero-video.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert to H.264 MP4
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Encode
        run: |
          ffmpeg -y -i "crossroads-kitchen-24s-hero-film.webm.mp4" \
            -c:v libx264 -preset medium -crf 21 -pix_fmt yuv420p \
            -movflags +faststart -an \
            "crossroads-kitchen-hero-h264.mp4"

      - name: Commit converted video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crossroads-kitchen-hero-h264.mp4
          git diff --cached --quiet && exit 0
          git commit -m "Add browser-compatible H.264 hero video"
          git push
